<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1">
<title>Où ranger le jeu ?</title>
<style>
  :root{
    --orange:#FF5500;
    --orange-dark:#B84708;
    --orange-soft:#FFE7D2;
    --teal:#1F5C56;
    --teal-soft:#DCEEEC;
    --cream:#FFF8F1;
    --paper:#FFFFFF;
    --ink:#2A211A;
    --ink-soft:#8A7A6A;
    --border:#EAD9C7;
    --radius:16px;
    --shadow:0 2px 12px rgba(42,33,26,0.10);
  }

  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    background:var(--cream);
    color:var(--ink);
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
    -webkit-font-smoothing:antialiased;
    min-height:100vh;
  }

  .app{
    max-width:640px;
    margin:0 auto;
    padding-bottom:48px;
  }

  .app__header{
    position:sticky;
    top:0;
    z-index:10;
    background:var(--cream);
    padding:24px 20px 18px;
    border-bottom:1px solid var(--border);
  }

  .brand{
    display:flex;
    align-items:center;
    gap:10px;
  }

  .brand__die{
    width:34px;
    height:34px;
    flex-shrink:0;
  }

  .brand h1{
    margin:0;
    font-size:1.5rem;
    font-weight:800;
    letter-spacing:-0.02em;
    color:var(--ink);
  }

  .app__subtitle{
    margin:6px 0 16px 44px;
    color:var(--ink-soft);
    font-size:0.92rem;
  }

  .search{
    display:flex;
    align-items:center;
    gap:8px;
    background:var(--paper);
    border:2px solid var(--border);
    border-radius:999px;
    padding:10px 14px;
    transition:border-color .15s ease;
  }

  .search:focus-within{
    border-color:var(--orange);
  }

  .search__icon{
    width:20px;
    height:20px;
    flex-shrink:0;
    color:var(--ink-soft);
  }

  .search input{
    border:none;
    outline:none;
    background:transparent;
    flex:1;
    min-width:0;
    font-size:1rem;
    color:var(--ink);
    font-family:inherit;
  }

  .search input::placeholder{
    color:var(--ink-soft);
  }

  .search__clear{
    border:none;
    background:var(--border);
    color:var(--ink);
    width:24px;
    height:24px;
    border-radius:50%;
    font-size:0.8rem;
    line-height:1;
    cursor:pointer;
    flex-shrink:0;
  }

  .search__clear:hover{
    background:var(--orange-soft);
  }

  .results{
    padding:20px 20px 0;
    display:flex;
    flex-direction:column;
    gap:14px;
  }

  .state{
    text-align:center;
    padding:48px 20px;
    color:var(--ink-soft);
  }

  .state__die{
    width:56px;
    height:56px;
    margin:0 auto 16px;
    color:var(--border);
  }

  .state--empty .state__die{
    color:var(--orange-soft);
  }

  .state--none .state__die{
    animation:wobble 0.6s ease;
  }

  @media (prefers-reduced-motion: reduce){
    .state--none .state__die{ animation:none; }
  }

  @keyframes wobble{
    0%{transform:rotate(0deg);}
    25%{transform:rotate(-8deg);}
    50%{transform:rotate(7deg);}
    75%{transform:rotate(-4deg);}
    100%{transform:rotate(0deg);}
  }

  .state p{
    margin:4px 0;
    font-size:0.95rem;
  }

  .state strong{
    color:var(--ink);
  }

  .count{
    font-size:0.82rem;
    color:var(--ink-soft);
    padding:0 2px;
  }

  .card{
    background:var(--paper);
    border:1px solid var(--border);
    border-radius:var(--radius);
    overflow:hidden;
    box-shadow:var(--shadow);
    animation:rise .25s ease;
  }

  @keyframes rise{
    from{opacity:0; transform:translateY(6px);}
    to{opacity:1; transform:translateY(0);}
  }

  @media (prefers-reduced-motion: reduce){
    .card{animation:none;}
  }

  .card__photo-wrap{
    position:relative;
    display:block;
    width:100%;
    border:none;
    padding:0;
    cursor:zoom-in;
    background:var(--orange-soft);
  }

  .card__photo{
    width:100%;
    height:auto;
    aspect-ratio:1/1;
    object-fit:cover;
    display:block;
  }

  /* Point orange contrasté 20px x 20px */
  .spot-marker {
    position: absolute;
    width: 20px;
    height: 20px;
    background-color: #FF5500; /* Orange haute visibilité */
    color: #FFFFFF;
    font-weight: 800;
    font-size: 11px;
    line-height: 1;
    border: 2px solid #FFFFFF; /* Bordure nette pour détacher le point du fond */
    border-radius: 50%;
    display: flex;
    align-items: center;
    justify-content: center;
    transform: translate(-50%, -50%);
    box-shadow: 0 0 0 1px rgba(0,0,0,0.5), 0 2px 6px rgba(0,0,0,0.6); /* Double ombre pour contraste sur fond clair ou sombre */
    animation: pulse 1.6s infinite ease-in-out;
    pointer-events: none;
  }

  @keyframes pulse {
    0% { transform: translate(-50%, -50%) scale(1); }
    50% { transform: translate(-50%, -50%) scale(1.3); }
    100% { transform: translate(-50%, -50%) scale(1); }
  }

  .card__body{
    padding:14px 16px 16px;
  }

  .card__games{
    display:flex;
    flex-wrap:wrap;
    gap:8px;
  }

  .chip{
    display:inline-flex;
    align-items:center;
    padding:6px 12px;
    border-radius:999px;
    font-size:0.88rem;
    font-weight:600;
  }

  .chip--match{
    background:var(--orange);
    color:#fff;
  }

  .chip--other{
    background:var(--teal-soft);
    color:var(--teal);
    font-weight:500;
  }

  .card__hint{
    margin:10px 0 0;
    font-size:0.78rem;
    color:var(--ink-soft);
  }

  .card--attente{
    border-style:dashed;
    border-color:var(--teal);
    background:var(--teal-soft);
    box-shadow:none;
  }

  .card--attente .card__body{
    padding:16px;
  }

  .card__attente-label{
    margin:0 0 10px;
    font-weight:700;
    color:var(--teal);
    font-size:0.92rem;
  }

  /* Lightbox */
  .lightbox{
    position:fixed;
    inset:0;
    background:rgba(20,15,10,0.92);
    display:flex;
    align-items:center;
    justify-content:center;
    z-index:100;
    padding:24px;
  }

  .lightbox[hidden]{display:none;}

  .lightbox img{
    max-width:100%;
    max-height:100%;
    border-radius:10px;
  }

  .lightbox__close{
    position:absolute;
    top:18px;
    right:18px;
    width:40px;
    height:40px;
    border-radius:50%;
    border:none;
    background:rgba(255,255,255,0.15);
    color:#fff;
    font-size:1.1rem;
    cursor:pointer;
  }

  .lightbox__close:hover{
    background:rgba(255,255,255,0.28);
  }

  :focus-visible{
    outline:3px solid var(--orange);
    outline-offset:2px;
  }
</style>
</head>
<body>

  <div class="app">
    <header class="app__header">
      <div class="brand">
        <svg class="brand__die" viewBox="0 0 48 48" fill="none" xmlns="http://www.w3.org/2000/svg">
          <rect x="4" y="4" width="40" height="40" rx="10" fill="var(--orange)"/>
          <circle cx="16" cy="16" r="3.4" fill="var(--cream)"/>
          <circle cx="32" cy="16" r="3.4" fill="var(--cream)"/>
          <circle cx="24" cy="24" r="3.4" fill="var(--cream)"/>
          <circle cx="16" cy="32" r="3.4" fill="var(--cream)"/>
          <circle cx="32" cy="32" r="3.4" fill="var(--cream)"/>
        </svg>
        <h1>Où ranger le jeu ?</h1>
      </div>
      <p class="app__subtitle">Tape le nom d'un jeu pour voir sa case de rangement.</p>

      <div class="search">
        <svg class="search__icon" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
          <circle cx="11" cy="11" r="7" stroke="currentColor" stroke-width="2"/>
          <line x1="21" y1="21" x2="16.65" y2="16.65" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
        </svg>
        <input id="searchInput" type="search" placeholder="Ex : Skyjo, Dixit, Carcassonne…" autocomplete="off" autocapitalize="off" spellcheck="false">
        <button id="clearBtn" class="search__clear" aria-label="Effacer la recherche" hidden>✕</button>
      </div>
    </header>

    <main id="results" class="results" aria-live="polite">
      <!-- Rempli par le script -->
    </main>
  </div>

  <div id="lightbox" class="lightbox" hidden>
    <button id="lightboxClose" class="lightbox__close" aria-label="Fermer la photo">✕</button>
    <img id="lightboxImg" src="" alt="">
  </div>

  // =====================================================================
  // LOGIQUE DE RECHERCHE
  // =====================================================================

  function normaliser(texte){
    return texte
      .normalize("NFD")
      .replace(/[\u0300-\u036f]/g, "")
      .toLowerCase()
      .trim();
  }

  function echapperHTML(texte){
    const div = document.createElement("div");
    div.textContent = texte;
    return div.innerHTML;
  }

  function rechercher(requete){
    const q = normaliser(requete);
    if (!q) return { type: "vide" };

    const jeuxTrouves = [];
    JEUX.forEach(function(j){
      if (normaliser(j.nom).includes(q)) jeuxTrouves.push(j);
    });

    if (jeuxTrouves.length === 0) return { type: "aucun" };

    const nomsTrouvesSet = new Set(jeuxTrouves.map(j => j.nom));

    const idsCases = [];
    jeuxTrouves.forEach(function(j){
      if (idsCases.indexOf(j.case) === -1){
        idsCases.push(j.case);
      }
    });

    const resultats = idsCases.map(function(id){
      if (id === null){
        const jeuxNonClasses = jeuxTrouves
          .filter(function(j){ return j.case === null; })
          .map(function(j){ return j.nom; })
          .sort(function(a, b){ return a.localeCompare(b, "fr"); });
        return { photo: null, jeux: jeuxNonClasses, matches: nomsTrouvesSet, nonClasse: true, spots: [] };
      }
      
      const c = CASES.find(function(c){ return c.id === id; });
      const jeuxDeLaCase = JEUX
        .filter(function(j){ return j.case === id; })
        .map(function(j){ return j.nom; })
        .sort(function(a, b){ return a.localeCompare(b, "fr"); });

      const spots = [];
      if (c && c.emplacements) {
        jeuxTrouves.forEach(function(j) {
          if (j.case === id && j.emplacement && c.emplacements[j.emplacement]) {
            const coord = c.emplacements[j.emplacement];
            spots.push({
              numero: j.emplacement,
              x: (coord.x / 800) * 100,
              y: (coord.y / 800) * 100
            });
          }
        });
      }

      return { photo: c ? c.photo : null, jeux: jeuxDeLaCase, matches: nomsTrouvesSet, nonClasse: false, spots: spots };
    });

    return { type: "resultats", resultats: resultats };
  }

  // =====================================================================
  // AFFICHAGE
  // =====================================================================

  const resultsEl = document.getElementById("results");
  const searchInput = document.getElementById("searchInput");
  const clearBtn = document.getElementById("clearBtn");
  const lightbox = document.getElementById("lightbox");
  const lightboxImg = document.getElementById("lightboxImg");
  const lightboxClose = document.getElementById("lightboxClose");

  const dieSVG = '<svg class="state__die" viewBox="0 0 48 48" fill="none" xmlns="http://www.w3.org/2000/svg">'
    + '<rect x="4" y="4" width="40" height="40" rx="10" stroke="currentColor" stroke-width="3"/>'
    + '<circle cx="16" cy="16" r="3" fill="currentColor"/>'
    + '<circle cx="32" cy="32" r="3" fill="currentColor"/>'
    + '<circle cx="24" cy="24" r="3" fill="currentColor"/>'
    + '</svg>';

  function afficher(requete){
    const r = rechercher(requete);

    if (r.type === "vide"){
      resultsEl.innerHTML =
        '<div class="state state--empty">' + dieSVG +
        '<p>Tape le nom d\'un jeu ci-dessus pour voir où il est rangé.</p>' +
        '<p>' + JEUX.length + ' jeux référencés dans la base.</p></div>';
      return;
    }

    if (r.type === "aucun"){
      resultsEl.innerHTML =
        '<div class="state state--none">' + dieSVG +
        '<p><strong>Aucun jeu ne correspond à « ' + echapperHTML(requete) + ' ».</strong></p>' +
        '<p>Vérifie l\'orthographe, ou demande à la personne qui gère le rangement de l\'ajouter à la base.</p></div>';
      return;
    }

    const compte = r.resultats.reduce(function(n, c){ return n + c.matches.size; }, 0);
    let html = '<p class="count">' + compte + ' jeu(x) trouvé(s)</p>';

    r.resultats.forEach(function(c){
      if (c.nonClasse){
        html += '<article class="card card--attente">';
        html += '<div class="card__body">';
        html += '<p class="card__attente-label">📦 Emplacement pas encore renseigné</p>';
        html += '<div class="card__games">';
        c.jeux.forEach(function(nom){
          html += '<span class="chip chip--match">' + echapperHTML(nom) + '</span>';
        });
        html += '</div></div>';
        html += '</article>';
        return;
      }

      html += '<article class="card">';
      html += '<button class="card__photo-wrap" data-photo="' + c.photo + '" aria-label="Agrandir la photo de la case">';
      html += '<img class="card__photo" src="' + c.photo + '" alt="Photo de la case de rangement">';
      
      c.spots.forEach(function(spot) {
      html += '<div class="spot-marker" style="left:' + spot.x + '%; top:' + spot.y + '%;"></div>';      });

      html += '</button>';
      html += '<div class="card__body"><div class="card__games">';
      c.jeux.forEach(function(nom){
        const estTrouve = c.matches.has(nom);
        html += '<span class="chip ' + (estTrouve ? "chip--match" : "chip--other") + '">' + echapperHTML(nom) + '</span>';
      });
      html += '</div><p class="card__hint">Touche la photo pour l\'agrandir.</p></div>';
      html += '</article>';
    });

    resultsEl.innerHTML = html;
  }

  searchInput.addEventListener("input", function(){
    clearBtn.hidden = searchInput.value.length === 0;
    afficher(searchInput.value);
  });

  clearBtn.addEventListener("click", function(){
    searchInput.value = "";
    clearBtn.hidden = true;
    searchInput.focus();
    afficher("");
  });

  resultsEl.addEventListener("click", function(e){
    const btn = e.target.closest(".card__photo-wrap");
    if (!btn) return;
    lightboxImg.src = btn.getAttribute("data-photo");
    lightbox.hidden = false;
  });

  function fermerLightbox(){
    lightbox.hidden = true;
    lightboxImg.src = "";
  }

  lightboxClose.addEventListener("click", fermerLightbox);
  lightbox.addEventListener("click", function(e){
    if (e.target === lightbox) fermerLightbox();
  });
  document.addEventListener("keydown", function(e){
    if (e.key === "Escape") fermerLightbox();
  });

  afficher("");
</script>
