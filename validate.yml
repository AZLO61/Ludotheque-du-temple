name: Validation des données

# Se déclenche à chaque push et pull request touchant data.js, pour attraper
# une faute de frappe ou un jeu mal référencé AVANT que ça n'atteigne le site
# consulté par les clients du bar.
on:
  push:
    paths:
      - "data.js"
      - "scripts/validate-data.mjs"
  pull_request:
    paths:
      - "data.js"
      - "scripts/validate-data.mjs"

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Vérifie la cohérence de data.js
        run: node scripts/validate-data.mjs
